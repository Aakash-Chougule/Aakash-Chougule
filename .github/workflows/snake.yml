name: Update Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?color_snake=%2322d3ee&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216e39
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%2322d3ee

      - name: Commit generated contribution files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution snake is already up to date."
          else
            git commit -m "chore: update contribution snake"
            git push
          fi
