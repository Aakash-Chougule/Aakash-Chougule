<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b17"/>
      <stop offset="100%" stop-color="#0c1526"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="45%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="1197" height="217" rx="22" fill="url(#bg)" stroke="url(#g)" stroke-width="3" stroke-opacity=".42"/>
  <g transform="translate(68,55)">
    <circle cx="0" cy="0" r="7" fill="#22c55e">
      <animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="6" fill="#86efac" font-size="15" font-weight="700" font-family="Segoe UI, Arial, sans-serif">CONTRIBUTION ENGINE READY</text>
  </g>
  <text x="68" y="112" fill="#f8fafc" font-size="25" font-weight="800" font-family="Segoe UI, Arial, sans-serif">GitHub contribution animation</text>
  <text x="68" y="147" fill="#94a3b8" font-size="16" font-family="Segoe UI, Arial, sans-serif">The workflow replaces this panel automatically with your live contribution snake.</text>
  <rect x="68" y="178" width="1060" height="5" rx="3" fill="#172033"/>
  <rect x="68" y="178" width="240" height="5" rx="3" fill="url(#g)">
    <animate attributeName="x" values="68;888;68" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>