<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b17"/>
      <stop offset="100%" stop-color="#0d1528"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1.5" y="1.5" width="1197" height="147" rx="24" fill="url(#bg)" stroke="url(#g)" stroke-width="3" stroke-opacity=".5"/>
  <circle cx="82" cy="75" r="34" fill="#101a31" stroke="url(#g)" stroke-width="2.5">
    <animate attributeName="r" values="30;36;30" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="82" y="87" text-anchor="middle" font-size="34" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif">🐍</text>
  <text x="140" y="68" fill="#f8fafc" font-size="34" font-weight="800" font-family="Segoe UI, Arial, sans-serif">CONTRIBUTION ACTIVITY</text>
  <text x="140" y="98" fill="#94a3b8" font-size="16" font-family="Segoe UI, Arial, sans-serif">A living view of consistency, learning and code shipped over time</text>
  <rect x="140" y="115" width="520" height="4" rx="2" fill="url(#g)" filter="url(#glow)">
    <animate attributeName="width" values="140;520;330;520" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="-220" y="0" width="140" height="150" fill="#ffffff" opacity=".025" transform="skewX(-18)">
    <animate attributeName="x" values="-220;1400" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>